
name: Build Qawaid APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: unzip -o Madarasatu_Hayatul_Islam_Phone_Build.zip -d .

      - name: Fix Java and Kotlin versions
        run: |
          python3 -c "from pathlib import Path; p=Path('app/build.gradle'); s=p.read_text(); s=s.replace('android {', '''android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }''', 1); p.write_text(s)"

      - name: Build APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Madarasatu-Hayatul-Islam-APK
          path: app/build/outputs/apk/debug/app-debug.apk

